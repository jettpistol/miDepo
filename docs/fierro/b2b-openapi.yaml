          maxLength: 20
        title:
          type: string
          title: Título
          maxLength: 250
      required:
      - isbn
      - title
    Sucursal:
      type: object
      properties:
        name:
          type: string
          title: Nombre de la sucursal
          maxLength: 100
        key:
          type: string
          title: Clave de la sucursal
          maxLength: 50
      required:
      - key
      - name
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
