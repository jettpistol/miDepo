    NullEnum:
      enum:
      - null
    PaginatedBookSearch:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookSearchResult'
      required:
      - count
      - next
      - previous
      - results
    PaginatedCompanyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    PriceListSummary:
      type: object
      properties:
        company:
          allOf:
          - $ref: '#/components/schemas/CompanySummary'
          readOnly: true
      required:
      - company
    PriceSummary:
      type: object
      properties:
        amount:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          readOnly: true
        currency:
          nullable: true
          title: Moneda
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        modification_date:
          type: string
          format: date-time
          readOnly: true
        price_list:
          allOf:
          - $ref: '#/components/schemas/PriceListSummary'
          readOnly: true
      required:
      - amount
      - modification_date
      - price_list
    Prices:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        currency:
          nullable: true
          title: Moneda
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        price_list:
          type: string
          title: Clave de la lista de precios
        book:
          allOf:
          - $ref: '#/components/schemas/SimpleBook'
          readOnly: true
        book_key:
          type: string
          writeOnly: true
        creation_date:
          type: string
          format: date-time
          readOnly: true
        modification_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - book
      - book_key
      - creation_date
      - modification_date
      - price_list
