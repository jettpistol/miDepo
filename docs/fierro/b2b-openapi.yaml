openapi: 3.0.3
info:
  title: Fierro B2B API Docs
  version: 0.1.17
  description: Documentación del API Rest del proyecto Fierro B2B.
paths:
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /availabilities/{isbn}/:
    post:
      operationId: add_availability
      description: "\n        Endpoint para la creación asíncrona de disponibilidades.\n\
        \n        Flujo de operación:\n            1. Recibe los datos de la disponibilidad\
        \ en el cuerpo de la petición.\n            2. Valida los datos y encola la\
        \ tarea de creación.\n            3. Retorna inmediatamente el ID de la tarea.\n\
        \        "
      parameters:
      - in: query
        name: allow_consign
        schema:
          type: boolean
        description: Permitido en consignación.
      - in: query
        name: allow_firme
        schema:
          type: boolean
        description: Permitido en firme.
      - in: query
        name: availability
        schema:
          type: string
        description: Código del tipo de disponibilidad (ver [/availability_types/](#/availability_types/)).
        required: true
      - in: query
        name: availability_target
        schema:
          type: string
        description: Clave del tipo de destinatario.
        required: true
      - in: query
        name: days_to_deliver
        schema:
          type: integer
        description: Días para la entrega.
      - in: path
        name: isbn
        schema:
          type: string
          pattern: ^[0-9Xx-]+$
        required: true
      - in: query
        name: stock
        schema:
          type: integer
        description: Stock del libro (Solo para disponibilidad "En Stock").
      - in: query
        name: sucursal
        schema:
          type: string
        description: Clave de la sucursal origen.
        required: true
      tags:
      - availabilities
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              BodyExample:
                value:
                  availability: string
                  stock: 1234
                  availability_target: string
                  allow_firme: true
                  allow_consign: true
                  days_to_deliver: string
                  sucursal: string
                summary: Body example
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea creación de disponibilidad encolada.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: El usuario que hizo la request no tiene una empresa asociada.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /availabilities/{isbn}/{availability_target_key}/{sucursal_key}/:
    put:
      operationId: put_availability
      description: "\n        Endpoint para la actualización asíncrona de disponibilidades.\n\
        \n        Flujo de operación:\n            1. Recibe los datos de la disponibilidad\
        \ en el cuerpo de la petición.\n            2. Valida los datos y encola la\
        \ tarea de actualización.\n            3. Retorna inmediatamente el ID de\
        \ la tarea.\n        "
      parameters:
      - in: query
        name: allow_consign
        schema:
          type: boolean
        description: Permitido en consignación.
      - in: query
        name: allow_firme
        schema:
          type: boolean
        description: Permitido en firme.
      - in: query
        name: availability
        schema:
          type: string
        description: Código del tipo de disponibilidad (ver [/availability_types/](#/availability_types/)).
      - in: path
        name: availability_target_key
        schema:
          type: string
        description: Destinatario
        required: true
      - in: query
        name: days_to_deliver
        schema:
          type: integer
        description: Días para la entrega.
      - in: path
        name: isbn
        schema:
          type: string
        description: ISBN del libro
        required: true
      - in: query
        name: stock
        schema:
          type: integer
        description: Stock del libro (Solo para disponibilidad "En Stock").
      - in: path
        name: sucursal_key
        schema:
          type: string
        description: Sucursal
        required: true
      tags:
      - availabilities
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              BodyExample:
                value:
                  availability: string
                  stock: 1234
                  availability_target: string
                  allow_firme: true
                  allow_consign: true
                  days_to_deliver: string
                  sucursal: string
                summary: Body example
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea actualización de disponibilidad encolada.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: El usuario no tiene una empresa asociada.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
    delete:
      operationId: delete_availability
      description: Elimina la disponibibilidad en base a los valores enviados en los
        parametros de la URL.
      parameters:
      - in: path
        name: availability_target_key
        schema:
          type: string
        description: Destinatario
        required: true
      - in: path
        name: isbn
        schema:
          type: string
        description: ISBN del libro
        required: true
      - in: path
        name: sucursal_key
        schema:
          type: string
        description: Sucursal
        required: true
      tags:
      - availabilities
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Disponibilidad eliminada exitosamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Error de integridad en la DB.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /availability_types/:
    get:
      operationId: get_availabilities_types
      description: Lista de tipos de disponibilidad soportadas en el sistema. [Listado
        ONIX 65](https://www.editeur.org/files/ONIX%20for%20books%20-%20code%20lists/ONIX_BookProduct_Codelists_Issue_65.html)
        (list 65)
      tags:
      - availability_types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeName'
          description: ''
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /books/:
    get:
      operationId: get_books
      description: Obtener una lista paginada de libros basada en filtros. Para formato
        de fechas ver [ISO 8601](https://www.w3.org/QA/Tips/iso-date.html.es)
      parameters:
      - in: query
        name: author
        schema:
          type: string
        description: Nombre o apellido del autor. La búsqueda se realiza por palabras
          completas, sin distinguir mayúsculas ni tildes.
      - in: query
        name: av_end_datetime
        schema:
          type: string
        description: Limite de fecha creación de disponibilidad.
      - in: query
        name: av_end_datetime_modification
        schema:
          type: string
        description: Limite de fecha modificación de la disponibilidad.
      - in: query
        name: av_start_datetime
        schema:
          type: string
        description: Inicio de fecha creación de disponibilidad.
      - in: query
        name: av_start_datetime_modification
        schema:
          type: string
        description: Inicio de fecha modificación de la disponibilidad.
      - in: query
        name: collection
        schema:
          type: string
        description: Colección del libro
      - in: query
        name: creation_company
        schema:
          type: string
        description: ID legal, nombre o razón social de la compañía que creó el libro.
          El ID legal exacto normalizado tiene prioridad; de lo contrario se incluyen
          todas las compañías coincidentes por nombre o razón social, sin tildes.
          Sin coincidencias se devuelven cero libros.
      - in: query
        name: editorial
        schema:
          type: string
        description: Editorial del libro
      - in: query
        name: end_creation_date
        schema:
          type: string
        description: Limite de fecha de creación.
      - in: query
        name: end_modification_date
        schema:
          type: string
        description: Limite fecha de modificación.
      - in: query
        name: isbn
        schema:
          type: string
        description: ISBN del libro
      - in: query
        name: owner_company
        schema:
          type: string
        description: Nombre, razón social o ID legal del propietario. El ID legal
          exacto normalizado tiene prioridad; de lo contrario se incluyen todas las
          compañías coincidentes por nombre o razón social, sin tildes. Sin coincidencias
          se devuelven cero libros.
      - in: query
        name: owner_or_creator
        schema:
          type: string
        description: ID legal, nombre o razón social del propietario o creador. El
          ID legal exacto normalizado tiene prioridad; de lo contrario se incluyen
          todas las compañías coincidentes por nombre o razón social, sin tildes.
          Sin coincidencias se devuelven cero libros.
      - in: query
        name: owner_or_provider
        schema:
          type: string
        description: ID legal, nombre o razón social del propietario o proveedor.
          El ID legal exacto normalizado tiene prioridad; de lo contrario se incluyen
          todas las compañías coincidentes por nombre o razón social, sin tildes.
          Sin coincidencias se devuelven cero libros. Se conservan los permisos de
          visibilidad de disponibilidades.
      - in: query
        name: provider
        schema:
          type: string
        description: Nombre, razón social o ID legal del proveedor. El ID legal exacto
          normalizado tiene prioridad; de lo contrario se incluyen todas las compañías
          coincidentes por nombre o razón social, sin tildes. Sin coincidencias se
          devuelven cero libros. Se conservan los permisos de visibilidad de disponibilidades.
      - in: query
        name: representation
        schema:
          type: string
          enum:
          - full
          - summary
          default: full
        description: summary conserva bibliografía, precios y disponibilidades visibles,
          omite review e isbn_owner y reduce las compañías anidadas. Sólo afecta GET
          /books/; la ficha individual siempre es completa.
      - in: query
        name: start_creation_date
        schema:
          type: string
        description: Inicio de fecha de creación.
      - in: query
        name: start_modification_date
        schema:
          type: string
        description: Inicio de fecha de modificación.
      - in: query
        name: subtitle
        schema:
          type: string
        description: Subtítulo del libro
      - in: query
        name: title
        schema:
          type: string
        description: Título del libro
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookSearch'
          description: Lista de libros paginada.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Revisar sintaxis de las fechas, por favor seguir el estandar
            [ISO 8601](https://www.w3.org/QA/Tips/iso-date.html.es)
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
    post:
      operationId: post_books
      description: "\n        Endpoint para la creación asíncrona de libros.\n\n \
        \       Flujo de operación:\n            1. Recibe los datos del libro en\
        \ el cuerpo de la petición.\n            2. Valida los datos y encola la tarea\
        \ de creación.\n            3. Retorna inmediatamente el ID de la tarea.\n\
        \        "
      parameters:
      - in: query
        name: Barcode
        schema:
          type: string
        description: Código de barras
      - in: query
        name: authors
        schema:
          $ref: '#/components/schemas/BookAuthor'
        description: Lista de autores del libro. El rol del autor se toma del [Código
          ONIX de roles](https://www.editeur.org/files/ONIX%20for%20books%20-%20code%20lists/ONIX_BookProduct_Codelists_Issue_65.html),
          lista 17.
      - in: query
        name: bookbinding
        schema:
          type: string
        description: Encuadernación
      - in: query
        name: categories
        schema:
          $ref: '#/components/schemas/BookCategoryDocumentation'
        description: Lista de materias del libro identificadas por código y estándar.
          Estándares actuales IBIC, ILHSA y THEMA
      - in: query
        name: collection
        schema:
          type: string
        description: Colección del libro
      - in: query
        name: country
        schema:
          type: string
        description: País de origen. Ver [ISO 3166-1](https://es.wikipedia.org/wiki/ISO_3166-1)
      - in: query
        name: edition
        schema:
          type: string
        description: Edición
      - in: query
        name: edition_date
        schema:
          type: string
        description: Fecha de edición. Ver [ISO 8601](https://www.w3.org/QA/Tips/iso-date.html.es)
      - in: query
        name: editorial
        schema:
          type: string
        description: Editorial del libro
        required: true
      - in: query
        name: high
        schema:
          type: number
          format: double
        description: Altura en cm
      - in: query
        name: isbn
        schema:
          type: string
        description: ISBN del libro
        required: true
      - in: query
        name: language
        schema:
          type: string
        description: Idioma del libro siguiendo el estandar [ISO-639](https://altalingua.es/codigos-lenguas/)
      - in: query
        name: pages
        schema:
          type: integer
        description: Páginas
      - in: query
        name: review
        schema:
          type: string
        description: Reseña
      - in: query
        name: spine
        schema:
          type: number
          format: double
        description: Lomo en cm
      - in: query
        name: subtitle
        schema:
          type: string
        description: Subtítulo del libro
      - in: query
        name: title
        schema:
          type: string
        description: Título del libro
        required: true
      - in: query
        name: weight
        schema:
          type: number
          format: double
        description: Peso en kg
      - in: query
        name: width
        schema:
          type: number
          format: double
        description: Ancho en cm
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea creación de libros encolada.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Se devuelve diccionario con detalle del error.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /books/{isbn}/:
    get:
      operationId: get_book
      description: Obtener un único libro por isbn.
      parameters:
      - in: path
        name: isbn
        schema:
          type: string
          pattern: ^[0-9Xx-]+$
        required: true
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDocumentation'
          description: Un único libro
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Se debe proporcionar un isbn.
        '404':
          description: Libro no encontrado.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
    put:
      operationId: put_book
      description: "\n        Endpoint para la actualización asíncrona de libros.\n\
        \n        Flujo de operación:\n            1. Recibe los datos del libro en\
        \ el cuerpo de la petición.\n            2. Valida los datos y encola la tarea\
        \ de actualización.\n            3. Retorna inmediatamente el ID de la tarea.\n\
        \        "
      parameters:
      - in: query
        name: Barcode
        schema:
          type: string
        description: Código de barras
      - in: query
        name: authors
        schema:
          $ref: '#/components/schemas/BookAuthor'
        description: Lista de autores del libro. El rol del autor se toma del [Código
          ONIX de roles](https://www.editeur.org/files/ONIX%20for%20books%20-%20code%20lists/ONIX_BookProduct_Codelists_Issue_65.html),
          lista 17.
      - in: query
        name: bookbinding
        schema:
          type: string
        description: Encuadernación
      - in: query
        name: categories
        schema:
          $ref: '#/components/schemas/BookCategoryDocumentation'
        description: Lista de materias del libro identificadas por código y estándar.
          Estándares actuales IBIC, ILHSA y THEMA
      - in: query
        name: collection
        schema:
          type: string
        description: Colección del libro
      - in: query
        name: country
        schema:
          type: string
        description: País de origen. Ver [ISO 3166-1](https://es.wikipedia.org/wiki/ISO_3166-1)
      - in: query
        name: edition
        schema:
          type: string
        description: Edición
      - in: query
        name: edition_date
        schema:
          type: string
        description: Fecha de edición. Ver [ISO 8601](https://www.w3.org/QA/Tips/iso-date.html.es)
      - in: query
        name: editorial
        schema:
          type: string
        description: Editorial del libro
        required: true
      - in: query
        name: high
        schema:
          type: number
          format: double
        description: Altura en cm
      - in: path
        name: isbn
        schema:
          type: string
        description: ISBN del libro
        required: true
      - in: query
        name: language
        schema:
          type: string
        description: Idioma del libro siguiendo el estandar [ISO-639](https://altalingua.es/codigos-lenguas/)
      - in: query
        name: pages
        schema:
          type: integer
        description: Páginas
      - in: query
        name: review
        schema:
          type: string
        description: Reseña
      - in: query
        name: spine
        schema:
          type: number
          format: double
        description: Lomo en cm
      - in: query
        name: subtitle
        schema:
          type: string
        description: Subtítulo del libro
      - in: query
        name: title
        schema:
          type: string
        description: Título del libro
      - in: query
        name: weight
        schema:
          type: number
          format: double
        description: Peso en kg
      - in: query
        name: width
        schema:
          type: number
          format: double
        description: Ancho en cm
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookDocumentation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea actualización de libros encolada.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Se debe proporcionar un isbn.
        '404':
          description: Libro no encontrado.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
    delete:
      operationId: delete_book
      description: Elimina el libro correspondiente al ISBN recibido.
      parameters:
      - in: path
        name: isbn
        schema:
          type: string
        description: ISBN del libro.
        required: true
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Libro borrado exitosamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: El libro tiene disponibilidades existentes ó se genero un error
            de integridad en la DB.
        '404':
          description: Libro no encontrado.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /company/:
    get:
      operationId: get_companies
      description: Obtiene la lista de empresas
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: Lista paginada con el detalle de cada compañia.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /company/{legal_id}/:
    get:
      operationId: get_company
      description: Obtiene los datos de una empresa.
      parameters:
      - in: path
        name: legal_id
        schema:
          type: string
          pattern: ^[0-9-a-zA-Z]+$
        required: true
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: Lista paginada con el detalle de la compañia.
        '404':
          description: No se encontró la compañía solicitada.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /isbns/:
    post:
      operationId: post_book
      description: Se recibe una lista de ISBNs y se devuelve una lista paginada con
        los libros correspondientes.
      tags:
      - isbns
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isbns:
                  type: array
                  items:
                    type: string
              example:
                isbns:
                - '9781234567897'
                - '9781234567898'
                - '9781234567899'
      security:
      - jwtAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
          description: Los ISBNs no fueron enviados como una lista de valores.
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
  /prices/:
    post:
      operationId: post_prices
      description: "\n        Endpoint para la creación asíncrona de precios.\n\n\
        \        Flujo de operación:\n            1. Recibe los datos del precio en\
        \ el cuerpo de la petición.\n            2. Valida los datos y encola la tarea\
        \ de creación.\n            3. Retorna inmediatamente el ID de la tarea.\n\
        \        "
      tags:
      - prices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prices'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Prices'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Prices'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea creación de precios encolada.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploError:
                  value:
                    detail: No se acepto la tarea.
                  summary: Ejemplo error
          description: Ocurrio un error durante la validación de datos
    put:
      operationId: put_prices
      description: "\n        Endpoint para la actualización asíncrona de precios.\n\
        \n        Flujo de operación:\n            1. Recibe los datos del precio\
        \ en el cuerpo de la petición.\n            2. Valida los datos y encola la\
        \ tarea de actualización.\n            3. Retorna inmediatamente el ID de\
        \ la tarea.\n        "
      tags:
      - prices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prices'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Prices'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Prices'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploÉxito:
                  value:
                    detail: Tarea encolada <task id>.
                  summary: Ejemplo éxito
          description: Tarea actualización de precios encolada.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EjemploError:
                  value:
                    detail: No se acepto la tarea.
                  summary: Ejemplo error
          description: Ocurrio un error durante la validación de datos
  /prices/{price_list_key}/{book_isbn}/:
    delete:
      operationId: delete_prices
      description: Elimina el precio de un libro en una lista de precios específica.
      parameters:
      - in: path
        name: book_isbn
        schema:
          type: string
        description: ISBN del libro.
        required: true
      - in: path
        name: price_list_key
        schema:
          type: string
        description: Clave de la lista de precios.
        required: true
      tags:
      - prices
      security:
      - tokenAuth: []
      - jwtAuth: []
      responses:
        '202':
          description: Tarea para borrado de precios encolada.
        '404':
          description: Precio no encontrado para la combinación de lista de precios
            y libro.
  /user/me/:
    get:
      operationId: user_me_retrieve
      description: Obtiene los datos del usuario de acceso.
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
        '401':
          description: No autorizado. El token JWT es inválido o no está presente.
